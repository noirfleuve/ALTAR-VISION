# Met à jour chaque jour le nombre d'auditeurs mensuels Spotify affiché sur music/index.html.
# Le chiffre est lu dans la balise og:description de la page artiste publique
# ("Artist · 33.1K monthly listeners."). Lançable aussi à la main depuis l'onglet Actions.
name: Spotify stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read monthly listeners
        run: |
          python3 - <<'PY'
          import re, sys, urllib.request
          url = "https://open.spotify.com/artist/3drZ2PagzD9hLXZGL5h4mv"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; Twitterbot/1.0)"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          m = re.search(r'og:description" content="[^"]*?([\d.,]+[KMB]?) monthly listeners', html)
          if not m:
              sys.exit("Monthly listeners not found on the Spotify page")
          value = m.group(1)
          print("Monthly listeners:", value)
          path = "music/index.html"
          page = open(path, encoding="utf-8").read()
          page, n = re.subn(r'(<b data-stat="monthly-listeners">)[^<]*(</b>)', r"\g<1>" + value + r"\g<2>", page)
          if n != 1:
              sys.exit("Stat placeholder not found in " + path)
          open(path, "w", encoding="utf-8", newline="").write(page)
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "spotify stats update"
          git push
